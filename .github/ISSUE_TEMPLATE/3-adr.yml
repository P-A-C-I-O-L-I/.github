name: Propuesta de ADR
description: Proponer una decisión de arquitectura para discutirla antes de escribir el ADR.
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Qué problema obliga a decidir y qué restricciones existen.
    validations:
      required: true
  - type: textarea
    id: opciones
    attributes:
      label: Opciones consideradas
      description: Cada opción con sus ventajas y desventajas.
      value: |
        1. **Opción A:** 
        2. **Opción B:** 
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Decisión propuesta
      description: Qué opción se propone y por qué.
    validations:
      required: true
  - type: textarea
    id: consecuencias
    attributes:
      label: Consecuencias
      description: Qué se gana, qué se sacrifica y qué queda pendiente.
    validations:
      required: true
  - type: textarea
    id: afectados
    attributes:
      label: ADRs y servicios afectados
      description: ADRs que esta decisión complementa o reemplaza, y servicios que debe modificar.
    validations:
      required: false
